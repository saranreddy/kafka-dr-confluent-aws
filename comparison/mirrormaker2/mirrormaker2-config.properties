# MirrorMaker 2 Configuration for MSK Connect
# This configuration replicates topics from primary to secondary MSK cluster

# Cluster definitions
clusters = primary, secondary

# Primary cluster (us-east-1)
primary.bootstrap.servers = <PRIMARY_MSK_BOOTSTRAP_SERVERS>
primary.security.protocol = SASL_SSL
primary.sasl.mechanism = AWS_MSK_IAM
primary.sasl.jaas.config = software.amazon.msk.auth.iam.IAMLoginModule required;
primary.sasl.client.callback.handler.class = software.amazon.msk.auth.iam.IAMClientCallbackHandler

# Secondary cluster (us-west-2)
secondary.bootstrap.servers = <SECONDARY_MSK_BOOTSTRAP_SERVERS>
secondary.security.protocol = SASL_SSL
secondary.sasl.mechanism = AWS_MSK_IAM
secondary.sasl.jaas.config = software.amazon.msk.auth.iam.IAMLoginModule required;
secondary.sasl.client.callback.handler.class = software.amazon.msk.auth.iam.IAMClientCallbackHandler

# Replication flow: primary -> secondary
primary->secondary.enabled = true
primary->secondary.topics = orders
primary->secondary.topics.blacklist = .*[\-\.]internal, .*\.replica, __.*

# Sync configuration
sync.topic.configs.enabled = true
sync.topic.acls.enabled = false

# Consumer group offset sync
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 30
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 30

# Replication settings
replication.factor = 3
offset-syncs.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
checkpoints.topic.replication.factor = 3

# Performance tuning
tasks.max = 4
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
refresh.topics.interval.seconds = 60
refresh.groups.interval.seconds = 60

# Metrics
metric.reporters = org.apache.kafka.common.metrics.JmxReporter

# Source connector config
source.cluster.alias = primary
target.cluster.alias = secondary

# Topic naming (no rename by default)
replication.policy.separator = .

# Connector-specific settings
connector.class = org.apache.kafka.connect.mirror.MirrorSourceConnector
key.converter = org.apache.kafka.connect.converters.ByteArrayConverter
value.converter = org.apache.kafka.connect.converters.ByteArrayConverter

# Checkpoint connector (for consumer offset sync)
checkpoints.connector.class = org.apache.kafka.connect.mirror.MirrorCheckpointConnector

# Heartbeat connector (for cluster connectivity monitoring)
heartbeat.connector.class = org.apache.kafka.connect.mirror.MirrorHeartbeatConnector
heartbeat.interval.seconds = 5
